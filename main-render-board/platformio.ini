; Render board: validated ESP32 platform and exact FastLED release.
; Keep the dependency version fixed when comparing rendering behavior.
[env:esp32dev]
platform = espressif32@6.5.0
board = esp32dev
framework = arduino

; USB programming and readable diagnostics. Binary board-to-board UART is
; configured separately in CubeCore.h and UARTReceiver.cpp.
upload_port = /dev/cu.usbserial-3
monitor_port = /dev/cu.usbserial-3
upload_speed = 115200
monitor_speed = 115200

lib_deps =
    fastled/FastLED@3.10.3
    symlink://../shared

; CubeCore.h selects the I2S parallel LED driver before including FastLED.
; Retain the tested interrupt setting; no experimental driver flags belong here.
build_flags =
    -DFASTLED_ALLOW_INTERRUPTS=1

    ; Temporary desktop spacer baseline: full randomized Animation playlist.
    ; Keep the two-buffer setting for the FIRST observation. Later change
    ; ONLY this DMA count to 4 for the separate refill-tolerance comparison.
    ; This must be a build flag: FastLED's own .cpp files need the same value.
    -DFASTLED_ESP32_I2S_NUM_DMA_BUFFERS=4
    -DCUBINA_CHECK_SPACERS=1
    -DCUBINA_ENABLE_UART_RECEIVER=1

