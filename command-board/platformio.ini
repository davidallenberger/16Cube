; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html


[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 115200
;Identify port by opening a terminal and using this command: ls /dev/cu.* & remember to use the correct ifdef in cubecore
upload_port = /dev/tty.usbserial-0001
monitor_port = /dev/tty.usbserial-0001


lib_deps =
    kosme/arduinoFFT @ ^2.0.2
    fastled/FastLED@3.6.0
    symlink://../shared

; --- CUSTOM BLUETOOTH CORE ---
; WARNING: Pulling from 'main.zip' means this core can auto-update if the cache clears.
; If this project compiles perfectly today, do not change this line. 
platform_packages = 
    framework-arduinoespressif32 @ https://github.com/maxgerhardt/pio-framework-bluepad32/archive/refs/heads/main.zip

    ; --- COMPILER FLAGS ---
build_flags =
   ; -DFASTLED_RMT_BUILTIN_DRIVER
    -DFASTLED_ALLOW_INTERRUPTS=1
