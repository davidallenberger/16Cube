; Render board: validated ESP32 platform and exact FastLED release.
; Keep the dependency version fixed when comparing rendering behavior.
[env:esp32dev]
platform = espressif32@6.5.0
board = esp32dev
framework = arduino

; USB programming and readable diagnostics. Binary board-to-board UART is
; configured separately in CubeCore.h and UARTReceiver.cpp.
; Fixed hub socket. The macOS serial device name can change on reconnect.
custom_usb_upload_location = 0-1.3
extra_scripts = post:../tools/select_upload_port.py
; Deliberately invalid if the resolver is skipped.
upload_port = /dev/cubina-location-resolver-required
monitor_port = hwgrep://VID:PID=10C4:EA60.*LOCATION=0-1[.]3$
upload_speed = 115200
monitor_speed = 115200

lib_deps =
    fastled/FastLED@3.10.3
    symlink://../shared

; CubeCore.h selects the I2S parallel LED driver before including FastLED.
; Retain the tested interrupt setting; no experimental driver flags belong here.
; App switches unwind C++ scene and game objects at the launcher boundary.
build_unflags = -fno-exceptions
build_flags =
    -fexceptions
    -DFASTLED_ALLOW_INTERRUPTS=1

    ; Tested rendering baseline: four DMA buffers, UART input enabled.
    ; This must be a build flag: FastLED's own .cpp files need the same value.
    -DFASTLED_ESP32_I2S_NUM_DMA_BUFFERS=4
    ; Spacer diagnostics are opt-in; keep audition output readable.
    -DCUBINA_CHECK_SPACERS=0
    -DCUBINA_ENABLE_UART_RECEIVER=1
    ; Set to 0 to use the original animation palette pool.
    -DINCLUDE_WLED_PALETTES=1
    ; Report color choices on scene entry or object/burst selection.
    -DCUBINA_LOG_ANIMATION_COLORS=1

